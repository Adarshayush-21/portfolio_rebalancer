
[build-system]
requires = ["setuptools>=68"]
build-backend = "setuptools.build_meta"

[project]
name = "portfolio-rebalancer"
version = "0.1.0"
description = "Reproducible, policy-constrained portfolio rebalancing simulation"
requires-python = ">=3.11"
dependencies = [
    "numpy>=1.26",
    "pandas>=2.1",
    "pydantic>=2.5",
    "sqlalchemy>=2.0",
]

[project.optional-dependencies]
dev = [
    "pytest>=8.0",
]
app = [
    "fastapi>=0.115",
    "uvicorn>=0.30",
]

[project.scripts]
portfolio-rebalancer = "portfolio_rebalancer.cli:main"

[tool.setuptools.packages.find]
where = ["src"]

[tool.pytest.ini_options]
testpaths = ["tests"]
pythonpath = ["src"]
addopts = "-ra"

[tool.setuptools.package-data]
portfolio_rebalancer = ["dashboard/*.html"]
